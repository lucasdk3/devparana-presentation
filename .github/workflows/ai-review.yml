name: AI Pull Request Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app-example/**"

permissions:
  contents: read
  pull-requests: write

env:
  REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL || 'claude-haiku-4-5-20251001' }}
  REVIEWER_MAX_TOKENS: ${{ vars.REVIEWER_MAX_TOKENS || '4096' }}
  REVIEWER_TRIAGE_MAX_TOKENS: ${{ vars.REVIEWER_TRIAGE_MAX_TOKENS || '256' }}

jobs:
  triage:
    name: Triage
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.triage.outputs.mode }}
      should_review: ${{ steps.triage.outputs.should_review }}
      agents: ${{ steps.triage.outputs.agents }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate diff
        run: git diff origin/${{ github.base_ref }}...HEAD -- app-example/ > /tmp/pr.diff

      - name: Run triage
        id: triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m reviewer triage \
            --diff /tmp/pr.diff \
            --pr-title "${{ github.event.pull_request.title }}" \
            --output github-output

  generic-review:
    name: Generic Review
    runs-on: ubuntu-latest
    needs: triage
    if: |
      needs.triage.outputs.mode == 'generic' ||
      (needs.triage.outputs.mode == 'auto' && needs.triage.outputs.should_review == 'true')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate diff
        run: git diff origin/${{ github.base_ref }}...HEAD -- app-example/ > /tmp/pr.diff

      - name: Run generic review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m reviewer review generic \
            --diff /tmp/pr.diff \
            --post-comment \
            --pr-number ${{ github.event.pull_request.number }}

  structured-review:
    name: Structured Review
    runs-on: ubuntu-latest
    needs: triage
    if: |
      needs.triage.outputs.mode == 'structured' ||
      (needs.triage.outputs.mode == 'auto' && needs.triage.outputs.should_review == 'true')
    outputs:
      approved: ${{ steps.review.outputs.approved }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate diff
        run: git diff origin/${{ github.base_ref }}...HEAD -- app-example/ > /tmp/pr.diff

      - name: Run structured review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m reviewer review structured \
            --diff /tmp/pr.diff \
            --context-dir app-example \
            --pr-title "${{ github.event.pull_request.title }}" \
            --post-comment \
            --pr-number ${{ github.event.pull_request.number }} \
            --github-output

  enforce:
    name: AI Review Gate
    runs-on: ubuntu-latest
    needs: [triage, structured-review]
    if: always() && needs.triage.result == 'success' && needs.structured-review.result == 'success'

    steps:
      - name: Check approval
        run: |
          approved="${{ needs.structured-review.outputs.approved }}"
          if [ "$approved" = "false" ]; then
            echo "AI Review Gate: REJEITADO — veja o comentário no PR para detalhes."
            exit 1
          else
            echo "AI Review Gate: APROVADO"
          fi

  skip-review:
    name: Skip Review (mudança trivial)
    runs-on: ubuntu-latest
    needs: triage
    if: needs.triage.outputs.mode == 'auto' && needs.triage.outputs.should_review == 'false'

    steps:
      - name: Post skip comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## AI Review Structured

          ✅ **APROVADO** — Mudança trivial detectada pela triagem. Review completo não necessário."
