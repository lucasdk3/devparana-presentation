- description: "Product Manager - detecta remoção de endpoint"
  vars:
    diff: |
      diff --git a/app-example/handlers/framework.py b/app-example/handlers/framework.py
      -@router.get("/frameworks/{id}", response_model=Framework)
      -def get_framework(id: str):
      -    framework = FRAMEWORKS.get(id)
      -    if not framework:
      -        raise HTTPException(status_code=404, detail="Framework not found")
      -    return framework
  system: "{{file '.claude/skills/product-manager/SKILL.md'}}"
  prompt: "{{diff}}"
  assert:
    - type: is-json
    - type: javascript
      value: JSON.parse(output).issues.length > 0
    - type: javascript
      value: JSON.parse(output).user_impact !== "none"

- description: "Product Manager - adição de endpoint não gera alerta"
  vars:
    diff: |
      diff --git a/app-example/tests/test_framework.py b/app-example/tests/test_framework.py
      +def test_list_frameworks():
      +    response = client.get("/frameworks")
      +    assert response.status_code == 200
  system: "{{file '.claude/skills/product-manager/SKILL.md'}}"
  prompt: "{{diff}}"
  assert:
    - type: is-json
    - type: javascript
      value: JSON.parse(output).user_impact === "none"
